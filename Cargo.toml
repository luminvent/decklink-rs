[package]
name = "blackmagic-decklink"
description = "Blackmagic Decklink bindings for rust"
version = "0.1.0"
license = "MIT/Apache-2.0"
authors = [
    "Marc-Antoine Arnaud <marc-antoine.arnaud@luminvent.com>",
    "Julian Waller <git@julusian.co.uk>"
]
homepage = "https://github.com/luminvent/rust-decklink"
repository = "https://github.com/luminvent/rust-decklink"
keywords = ["blackmagic", "decklink", "sdi", "video", "audio"]
edition = "2024"
build = "build.rs"
readme = "README.md"
exclude = [
    "gen-bindings.sh",
]

[dependencies]
num-traits = "0.2"
num-derive = "0.5"
bitflags = "2.0"
strum = "0.28"
strum_macros = "0.28"
aligned-vec = "0.6"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
text_io = "0.1"
